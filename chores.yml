version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-disk-partitions is knowledge that belongs to rust-disk-partitions.
# `staticlib` is the whole interface a consumer needs, AND IT TAKES NO
# OUTPUT DIRECTORY: it builds into this crate's own dist/, `chore artifact`
# prints the absolute path of that DIRECTORY, and a consumer copies its
# contents. It is the same pair of tasks, with the same contract, that every
# sibling library exposes.
#
# `artifact` PRINTS A DIRECTORY, NOT A FILE. That is the one place this
# differs from rust-blk-probe, whose single binary lets its `artifact` name a
# file: this crate produces libdisk_partitions.a AND the headers beside it, so
# there is no single path to name.
#
# NO KNOWN CONSUMER LINKS THIS ARCHIVE TODAY, and that is worth saying
# rather than leaving a reader to wonder why the task exists. Consumers
# take rust-disk-partitions as a CRATE — through rust-disk-probe, and as a
# dev-dependency of the img readers' `inspect` example — so it arrives
# already linked inside somebody else's output. The task is here for
# uniformity, for anyone building this crate on its own, and because the
# moment a consumer does want the archive it should not have to learn the
# triple.
#
# WHY fs_core.h IS COPIED TOO. include/disk_partitions.h opens with
# `#include "fs_core.h"` — the probe reads through a FsCoreDevice — so a
# consumer given only disk_partitions.h cannot compile. The path below is the same
# one Cargo.toml resolves rust-fs-core from, and NOTHING CHECKS THAT THE TWO
# AGREE.
vars:
  TRIPLE: aarch64-apple-darwin
  # `[package].name` is rust-disk-partitions; `[lib].name` is partitions, so cargo
  # writes libdisk_partitions.a. The header mirrors the lib name.
  LIBNAME: disk_partitions

tasks:
  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'
      - 'include/*.h'
      # fs_core.h is a source of ours because we ship it (see the cp below).
      # THIS PATH AND THE cp MUST AGREE, and nothing checks that they do.
      - '../rust-fs-core/include/fs_core.h'
      # THE GUARD IS PART OF THIS TASK, SO IT IS PART OF THE FINGERPRINT.
      #
      # The first command below runs
      # tests/header_names_the_built_library.rs, and neither that file
      # nor this one was a source -- so editing the guard left the task
      # up to date and the guard did not run. Force its body to fail,
      # change nothing else, and `chore staticlib` prints exactly
      # "task: staticlib is up to date" and executes nothing.
      #
      # A check whose result nothing re-reads, in the step that decides
      # what ships. chores.yml is here for the same reason: the command
      # list, the artefact paths and the guard's invocation all live in
      # this file, and a change to any of them changes the task.
      #
      # THE FILE THE TASK RUNS, NOT THE DIRECTORY IT LIVES IN. The
      # sibling closed this with 'tests/**/*.rs', which fingerprints
      # every file in tests/ -- 6 here -- while `cmds:` runs exactly
      # one target, so editing an unrelated test re-runs the whole task
      # including the cross-target release build it could not have
      # affected. That is rust-img-vhdx#85, and copying the fix verbatim
      # reproduces it.
      #
      # DO NOT ANSWER EITHER BY DROPPING THE ENTRY. The rule is that
      # `sources:` names what the task READS -- so if a second `--test`
      # target is ever added below, its file belongs here beside this
      # one.
      # `the_staticlib_task_fingerprints_the_tests_it_runs_and_no_others`
      # in tests/header_names_the_built_library.rs refuses both
      # directions.
      - 'tests/header_names_the_built_library.rs'
      - chores.yml

    # Templated, which is fine here where it is not fine above: UpToDate
    # renders these before expanding them, and every entry is an exact path
    # rather than a glob, so a missing artifact is caught by the pattern
    # failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'
      - '{{.OUT}}/include/{{.LIBNAME}}.h'

    cmds:
      # THE HEADER CHECK IS THE TEST, NOT A SECOND COPY OF IT.
      #
      # This was a shell fragment that grepped the header and compared
      # what it found against `lib{{.LIBNAME}}.a` -- a value derived
      # from the same hand-maintained LIBNAME variable it was checking.
      # A LIBNAME/Cargo.toml drift, which is precisely what it existed
      # to catch, passed it silently: rename `[lib] name` and cargo
      # builds a different artefact while the guard compares LIBNAME
      # against itself and agrees. A check whose two sides come from one
      # source cannot fail.
      #
      # tests/header_names_the_built_library.rs derives the expected
      # name from Cargo.toml's `[lib] name` -- the thing that actually
      # decides the artefact -- with a real TOML parser rather than a
      # line scan. Running it here means one implementation instead of
      # two, and the one that is already exercised by CI.
      #
      # It stays FIRST so a mismatch costs no release build.
      - 'cargo test --locked --test header_names_the_built_library'
      # Idempotent: rustup answers "up to date" without touching the network
      # when the target is already installed. It runs here rather than in the
      # consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  build:
    desc: Debug build
    cmds: ['cargo build']

  # THE TIERS, THEIR BUDGETS AND THEIR FLOORS.
  #
  # A tier runs through scripts/tier.sh: the whole run goes to
  # tmp/logs/<log>.log, a pass prints one verdict line naming it, and a run
  # that passed but printed more than its budget fails with status 65. Before
  # this, every green matrix leg replayed 289 `... ok` lines -- 1,236 across
  # the three legs of a green run, and 4,262 lines over six jobs (#127).
  #
  # EVERY NUMBER BELOW WAS MEASURED, and the measurement is named beside it.
  # Raise a budget deliberately, with the run that justifies it; lowering one
  # to make a run fit is the defect the budget exists to catch. A floor only
  # ever goes up.
  #
  #   tier     measured lines/bytes   budget         floor  measured tests
  #   debug    348 / 21,640           440 / 28,000     258  293
  #   release  351 / 21,849           440 / 28,000     258  293
  #   oracle    14 /    667            40 /  3,000       9  9
  #
  # EVERY ROW WAS MEASURED IN CI, from the retained tier-logs-* artifacts of
  # run 36411947701 on the branch for #127 -- the debug row from the largest
  # of the three matrix legs (windows-latest; ubuntu and macOS were 21,604
  # bytes). CI is the place to measure: its absolute paths are longer than a
  # host's and a cold cargo cache prints a `Compiling` line per dependency
  # into the same log, so a host measurement flatters the row. The host runs
  # for comparison were 348 / 21,474 and 14 / 668, which is what the
  # artefacts being kept is for.
  #
  # The budgets sit ~25% above the measurement rather than ~10%, so ordinary
  # churn in the suite does not trip them while the transcript this replaced
  # -- 289 `... ok` lines per leg, replayed unconditionally -- could not
  # return unnoticed.
  #
  # The floors are scripts/test-floor.sh, not the budget: a budget fails a
  # tier that PRINTS too much and cannot see a tier that RAN almost nothing.
  # 258 is the floor CI has carried since #120, about 12% below the 293 this
  # suite executes today; the oracle's is 9, which is every test in it,
  # because each one is a whole table format or a whole direction and losing
  # one is not churn.
  #
  # `test:scripts` has no budget and no floor on purpose: it prints one PASS
  # line per check rather than cargo's `test result:` lines, so the floor
  # would read zero for a tier that ran everything.
  test:
    desc: The suite, in debug, where overflow checks are on
    cmds:
      - 'scripts/tier.sh "test (debug)" debug 440 28000 -- cargo test --locked --all-targets'
      - 'bash scripts/core.sh test-floor debug 258'

  test:release:
    desc: The same suite in release, where arithmetic wraps instead of panicking
    # Both profiles are run on purpose: arithmetic that panics in debug can
    # wrap silently in release, and this crate's inputs are numbers off a
    # disk. tests/ci_profile.rs holds the debug run to being a debug run.
    cmds:
      - 'scripts/tier.sh "test (release)" release 440 28000 -- cargo test --locked --release --all-targets'
      - 'bash scripts/core.sh test-floor release 258'

  test:oracle:
    desc: This crate's tables against sgdisk, sfdisk, blkid and partx
    # THE ONLY CHECK HERE THAT IS NOT THIS CRATE MARKING ITS OWN HOMEWORK.
    # Behind the `oracle` feature because the target refuses to skip when a
    # tool is missing, and the macOS and Windows CI legs have none of them.
    # `--nocapture` is what lets each test's comparison count out of the
    # harness and into the log, where the second floor in ci.yml reads it.
    cmds:
      - 'scripts/tier.sh "test (oracle)" oracle 40 3000 -- cargo test --locked --quiet --features oracle --test oracle_tools -- --nocapture'
      - 'bash scripts/core.sh test-floor oracle 9'

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, and that is the one place this differs
    # from rust-blk-probe's `artifact`. That crate produces a single binary, so
    # it can name a file. This one produces libdisk_partitions.a AND the headers
    # beside it, so there is no single path to name — A CONSUMER COPIES THE
    # CONTENTS of what this prints. A consumer that treats it as a file path
    # will silently copy the wrong thing.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'

  lint:
    desc: Formatting and clippy, exactly as CI runs them
    cmds:
      - scripts/agents-core-check.sh
      - task: test:scripts
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings

  test:scripts:
    desc: Every tests/scripts/*.sh guard, exactly as CI runs them
    cmds:
      - 'for t in tests/scripts/*.sh; do bash "$t" || exit 1; done'

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    # Against the newest version on crates.io, with cargo-semver-checks: a
    # break needs the 0.x minor to move, an addition the patch. Why, and what
    # it cannot see, is at the top of the script. No `sources:` on purpose --
    # the baseline is the registry, which moves without this tree changing,
    # so a fingerprint would call a stale answer up to date.
    #
    # THE BUDGET is rust-fs-ext4's measurement of the same script: 11 lines /
    # 489 bytes passing with the baseline's rustdoc cached, one line more when
    # it is built. Its lines are fixed, not per item, so 40 / 4,000 leaves
    # room for a warning block without hiding a flood. No floor: it is one
    # check, not a suite.
    cmds:
      - 'bash scripts/tier.sh semver semver 40 4000 -- bash scripts/core.sh semver-check'

  check:ci-gate:
    desc: The one required check stands for every job in ci.yml
    # A chore task naming a script, and nothing else -- the script is what can
    # be tested, reviewed and run without chore at all.
    #
    # This was tests/ci_aggregate_gate.rs. It was the wrong container twice
    # over: it parses a YAML file and compares strings, exercising nothing this
    # crate ships, and as a cargo test it counted towards the executed-test
    # floor the gate itself enforces -- so the suite could satisfy its floor
    # partly by checking its own CI config.
    cmds:
      - bash scripts/core.sh ci-gate