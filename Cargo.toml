[package]
name = "rust-disk-partitions"
version = "0.7.1"
edition = "2021"
license = "MIT"
description = "Pure-Rust partition-table probe (GPT/MBR) and filesystem-magic sniffer."
repository = "https://github.com/antimatter-studios/rust-disk-partitions"

# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
exclude = ["fuzz"]

# The name this crate had on crates.io: the semver check's baseline until
# a release exists under the new one (rust-fs-core's semver-check.sh).
[package.metadata.semver]
former-name = "am-partitions"

# ONE REPOSITORY, TWO CRATES (#150). This library says where the regions of
# a disk are and sniffs what each holds; `crates/blk-probe` is the `blk.probe`
# command-line tool that opens a disk image (raw, qcow2, vhd, vhdx, vmdk) and
# prints that answer as JSON. They were two repositories, and the tool carried
# a second copy of the XFS, Btrfs and EROFS sniff; as one workspace a change
# to the sniff is tested through the tool in the same pull request.
#
# THIS PACKAGE STAYS AT THE ROOT, and it is the workspace's only default
# member: `cargo build`, `cargo test` and `cargo publish` here mean the
# library, exactly as they did before the tool arrived, and the library's
# dependency list is its own. The tool is reached with `-p rust-blk-probe`,
# and only it pulls in the four image readers.
#
# The two fuzz crates are their own workspaces, on their own toolchain
# (nightly, for cargo-fuzz). The library's is excluded here; the tool's sits
# under a member's directory, where cargo would overrule an `exclude`, so it
# declares its own empty `[workspace]` instead.
[workspace]
members = ["crates/blk-probe"]
default-members = ["."]
exclude = ["fuzz"]

[lib]
# Published as `rust-disk-partitions` on crates.io; consumers
# `use disk_partitions::...` inside their code. The import is the repository
# name without its `rust-` prefix, which the package name keeps.
name = "disk_partitions"
crate-type = ["staticlib", "rlib"]

[dependencies]
# IEEE 802.3 CRC32 — required for GPT header / partition-array validation.
crc32fast = "1"
# Block-device trait surface (BlockRead + FileDevice). Local path dep until
# both crates publish; flip to a published version on the first release.
rust-fs-core = { path = "../rust-fs-core", version = "0.3.12" }

[dev-dependencies]
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. It PARSES the file rather than
# scanning its text: quoted keys, block scalars, comments and nested
# mappings are the grammar, not edge cases, and a guard that misreads
# its input reports protection it is not providing. Pure Rust, YAML 1.2
# (so GitHub's `on:` key stays the string `on` and is not folded into a
# boolean), MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml,
# which is deprecated and wraps unsafe-libyaml. Dev-only: it never
# reaches a consumer of this crate. Same version as the siblings, so the
# copies of this guard stay one answer rather than several.
saphyr = "0.0.12"
# JSON parser for the external-tool oracle, which reads `sfdisk --json`.
# sfdisk's own output is the reference description of a partition table,
# and parsing it by hand -- the shape blk-probe emits JSON with -- would
# put a second parser of somebody else's format in the position of
# deciding whether this crate is right. Dev-only, and the same version
# the siblings rust-img-vhdx and rust-img-qcow2 already carry.
serde_json = "1"
tempfile = "3"
toml = "1.1.5"

# THE ORACLE IS BEHIND A FEATURE BECAUSE IT NEEDS TOOLS THE MATRIX
# DOES NOT HAVE.
#
# `tests/oracle_tools.rs` runs sgdisk, sfdisk, blkid and partx and
# refuses to skip when they are absent (see tests/common/mod.rs). That
# refusal is the point of the suite and it is also why the target cannot
# be in the default selection: `test / macos-latest` and
# `test / windows-latest` have none of those tools, so `cargo test
# --all-targets` there would fail on a machine that was never asked to
# carry them.
#
# `required-features` is how cargo is told, rather than a `cfg` inside
# the file: a `cfg(target_os = "linux")` would leave the target in the
# selection and silently compile to an empty binary elsewhere, which is
# a skip wearing a different hat. With the feature off the target is not
# built at all, and the one job that sets it -- `oracle (external
# tools)` in .github/workflows/ci.yml, which apt-installs gdisk and
# util-linux first -- runs every test in it or fails.
[features]
oracle = []

[[test]]
name = "oracle_tools"
required-features = ["oracle"]

# md arrays against the kernel's /dev/mdX. Same feature, same job: the
# arrays are built there under sudo by scripts/make-md-oracle.sh first,
# and the target fails rather than skips when they are absent.
[[test]]
name = "oracle_md"
required-features = ["oracle"]

# LVM2 logical volumes against the kernel's device-mapper, one of them on
# md RAID inside GPT partitions. Built by scripts/make-lvm-oracle.sh under
# sudo first; the target fails rather than skips when they are absent.
[[test]]
name = "oracle_lvm"
required-features = ["oracle"]

# ONE rust-fs-core FOR THE WHOLE GRAPH. The image readers the tool links
# depend on rust-fs-core from crates.io; this library and the tool use the
# checkout beside the repository. Without the patch cargo builds both, and
# the tool's link carries two copies of every `#[no_mangle]` fs_core_* entry
# point. A patch is a workspace setting and never reaches a consumer of the
# published library.
[patch.crates-io]
rust-fs-core = { path = "../rust-fs-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"

# The tool's release binary is stripped, as it was in its own repository; a
# profile is a workspace setting, so the override lives here.
[profile.release.package.rust-blk-probe]
strip = true
