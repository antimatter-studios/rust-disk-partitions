name: release blk.probe

# A pushed `blk-probe-v<version>` tag publishes the blk.probe tool's release
# tarballs: bin/blk.probe and LICENSE, one for darwin-arm64 and one for
# linux-x86_64, each with a .sha256 and a build-provenance attestation,
# attached to the GitHub release for the tag. Nothing is published to
# crates.io -- the tool is consumed as the tarballs.
#
# TWO CRATES, TWO TAG STREAMS (#150). This repository's other release,
# release.yml, publishes the rust-disk-partitions library on `v*.*.*`; this
# one publishes crates/blk-probe on `blk-probe-v*.*.*`. A tag pattern matches
# from its first character, so neither can fire on the other's tag. The tool
# was the rust-blk-probe repository until #150, and its releases up to v0.1.2
# are there.
#
# TAGS ARE PUSHED BY A PERSON. Nothing in this repository creates one.
#
# It owns almost nothing itself. The gate is ci.yml, called whole, so a tag is
# held to exactly what a pull request is held to; and the tarball is written
# and checked by the same crates/blk-probe/scripts/package.sh and
# check-package.sh ci.yml's `blk-probe-package` legs run on every pull
# request, for the same two platforms -- so the first run of this workflow is
# not the first time the packaging ran on either.
#
# crates/blk-probe/tests/scripts/test-release-platforms.sh fails a pull request
# in which this workflow stops packaging, attesting or attaching either
# platform (rust-blk-probe#45: its first release shipped darwin-arm64 alone).
#
# Verify a downloaded tarball with:
#   gh attestation verify rust-blk-probe-<version>-<platform>.tar.gz \
#     --repo antimatter-studios/rust-disk-partitions \
#     --signer-workflow antimatter-studios/rust-disk-partitions/.github/workflows/release-blk-probe.yml
#
# NOT A REQUIRED CHECK AND MUST NEVER BECOME ONE: it has no `pull_request:`
# trigger, so it can never report on a pull request, and a required context
# that never reports reads to GitHub as permanently pending.
on:
  push:
    tags: ['blk-probe-v*.*.*']

permissions:
  contents: read

env:
  # The rust-fs-core tag the package legs clone, the same one ci.yml's jobs
  # do; tests/ci_profile.rs holds every declaration of it to one version.
  FS_CORE_REF: v0.3.12

jobs:
  # A tag that disagrees with the tool's Cargo.toml would publish a tarball
  # whose name and contents name different versions.
  verify-tag:
    name: verify tag matches crates/blk-probe/Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: compare tag against the manifest
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#blk-probe-v}"
          version="$(grep -m1 '^version = ' crates/blk-probe/Cargo.toml | sed 's/version = //; s/"//g')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/blk-probe/Cargo.toml version $version"
            exit 1
          fi
          echo "tag and crates/blk-probe/Cargo.toml agree on $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gate:
    name: branch gate
    uses: ./.github/workflows/ci.yml

  # ONE LEG PER PLATFORM, each built natively on a runner of that platform.
  # READ-ONLY: a leg builds, packages and checks its tarball, then hands it on
  # as a workflow artifact, so a failed leg cannot leave a release with one
  # platform on it.
  package:
    name: package / ${{ matrix.platform }}
    needs: [verify-tag, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - name: build the binary the tarball carries
        run: cargo build --locked --release -p rust-blk-probe --bin blk_probe
      - name: package it, and check what was packaged
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$(bash crates/blk-probe/scripts/package.sh target/release/blk_probe "$VERSION" ${{ matrix.platform }} dist)"
          bash crates/blk-probe/scripts/check-package.sh "$tarball"
          # A formula update is a copy of this, not a re-download and re-hash.
          {
            echo "### $(basename "$tarball")"
            echo ""
            echo '```'
            cat "$tarball.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: hand the tarball to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The one job that writes, after every leg has passed. It collects the legs'
  # tarballs, re-checks each against its .sha256, signs a build-provenance
  # attestation over them and attaches the tarballs and their checksums to the
  # release.
  publish:
    name: attest and attach the tarballs
    needs: [verify-tag, package]
    runs-on: ubuntu-latest
    # The only job with a write grant, because it is the only one that needs
    # one: an OIDC token to sign the attestation, the attestation store, and
    # the release the tarballs are attached to.
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      # Checked out for the tool's CHANGELOG.md, which the release notes come
      # from; nothing is built here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: collect every leg's tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: one tarball per platform, each matching its checksum
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          for platform in darwin-arm64 linux-x86_64; do
            tarball="rust-blk-probe-$VERSION-$platform.tar.gz"
            if [ ! -f "$tarball" ] || [ ! -f "$tarball.sha256" ]; then
              echo "::error::no $tarball with its .sha256; found: $(ls -A | tr '\n' ' ')"
              exit 1
            fi
            shasum -a 256 -c "$tarball.sha256"
          done
          count="$(ls -1 ./*.tar.gz | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 tarballs, one per package leg, found $count: $(ls -A | tr '\n' ' ')"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The release body is this version's section of the TOOL'S CHANGELOG,
      # crates/blk-probe/CHANGELOG.md, whose headings are plain versions; the
      # tag's `blk-probe-` prefix is this repository's, not the changelog's.
      - name: the release notes are this version's CHANGELOG section
        uses: antimatter-studios/agent-skills/.github/actions/changelog-notes@ed0b96812c5908478dcd84543debf4d5f8bf87e3
        with:
          tag: v${{ needs.verify-tag.outputs.version }}
          path: crates/blk-probe
          output-file: ${{ runner.temp }}/release-notes.md
      # Idempotent: a re-run of a tag whose upload succeeded replaces the
      # assets rather than failing on them.
      - name: attach the tarballs to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "blk.probe $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
