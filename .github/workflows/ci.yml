name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.3.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked --all-targets
      - name: test
        # `shell: bash` IS LOAD BEARING ON THE WINDOWS LEG. The default
        # shell there is pwsh, which cannot run the tier wrapper at all;
        # ubuntu and macOS already default to bash, and saying it here
        # keeps all three legs running one script.
        shell: bash
        # A VERDICT, NOT A TRANSCRIPT (#127). This step used to capture
        # the run by redirection and then `cat` the whole log back from a
        # trap, unconditionally -- so the capture bought nothing and every
        # green leg replayed 289 `... ok` lines, 1,236 of them across this
        # matrix on every green run. ../rust-fs-core/scripts/tier.sh runs the suite
        # QUIETLY: the whole run goes to tmp/logs/debug.log, a pass prints
        # one verdict line naming it, and a run that passed but printed
        # more than its budget fails with status 65. The logs are uploaded
        # below, so the detail is never lost -- reading it is a choice
        # rather than a toll.
        #
        # THE BUDGET IS NOT A CI RULE. The same task with the same budget
        # is what `chore test` runs on a laptop, because a rule only CI
        # enforces is one the tree drifts away from between pull requests.
        # The numbers are measured and live in chores.yml beside the task.
        #
        # NOT PIPED INTO ANYTHING. Actions runs a `run:` block as bash with
        # `-e`, where a pipeline's status is its LAST member's, so
        # `cargo test ... | tee log` exits 0 with the suite red.
        # tests/ci_profile.rs refuses that spelling and is right to: a
        # capture that swallows the result is worse than no capture. The
        # wrapper exits with the command's own status and nothing follows
        # it on the line.
        #
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it
        # is what makes every arithmetic test in this crate mean anything.
        # The variable tells `overflow_checks::the_build_the_gate_asked_to
        # _check_does_check` in src/lib.rs that THIS is the run that must
        # trap an overflow -- asking the build directly rather than
        # inferring it from which spellings of "disabled" happen to be
        # absent from Cargo.toml. It is declared as an `env:` mapping
        # rather than inline as `VAR=1 cargo test` because this job also
        # runs on windows-latest, where that prefix is a PowerShell syntax
        # error.
        #
        # Do not add `--release` to this run, and do not drop the
        # variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting this.
        # It reads through the tier wrapper to find it. See #86, #127.
        #
        # THE FLOOR IS A SEPARATE SCRIPT, BECAUSE THE FAILURE MODE HERE IS
        # AN ABSENCE. This job reports green on `0 passed; 0 failed`
        # exactly as loudly as on the whole suite: cargo exits 0 when a
        # filter selects nothing, when a target list comes out empty, and
        # when no test binary was built at all. Only a count can see it,
        # and the budget cannot -- a tier that ran nothing prints less,
        # not more. ../rust-fs-core/scripts/test-floor.sh reads the tier's log and fails
        # below 258; 293 executed on 2026-09-28, and the floor moves up
        # with the suite and never down.
        #
        # The `oracle (external tools)` job's tests are NOT in that
        # number: their target carries `required-features = ["oracle"]`,
        # so `--all-targets` here does not build it. That job has its own
        # tier and its own floor.
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (debug)" debug 520 30000 -- cargo test --locked --all-targets
          bash ../rust-fs-core/scripts/test-floor.sh debug 258
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: keep the tier logs
        # `if: always()`, because the run worth reading is the one that
        # failed. A quiet tier is only honest if the detail it did not
        # print is still retrievable. One artefact per matrix leg: three
        # uploads under one name is an error, and a leg's log is the one
        # thing that distinguishes it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-debug-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: warn

  # The debug profile turns integer overflow into a panic; the release
  # profile, which is what ships, lets it wrap. A guard against a
  # wrapping computation therefore passes in `cargo test` for the wrong
  # reason — the panic — while the behaviour it guards against is still
  # live in the built library. Running the suite once in release is what
  # makes those tests mean anything.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.3.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: build --release
        # OUTSIDE THE BUDGET, so a cold cache's `Downloaded` and `Compiling`
        # lines land here and not in the tier below (#155). `--no-run` builds
        # exactly what the budgeted run executes, so that run compiles
        # nothing. `every_budgeted_cargo_test_is_built_before_its_budget_starts`
        # in tests/ci_profile.rs keeps this step here.
        run: cargo test --locked --release --all-targets --no-run
      - name: test --release
        shell: bash
        # Through the same wrapper, under the same budget, with its own
        # log and its own floor: the release build produces its own test
        # binaries, and a release run that collapsed to nothing while the
        # debug legs stayed whole would be invisible to a count taken in
        # the other job. See the debug step above for why the output is a
        # verdict rather than a transcript.
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (release)" release 520 30000 -- cargo test --locked --release --all-targets
          bash ../rust-fs-core/scripts/test-floor.sh release 258
      - name: keep the tier logs
        # `if: always()`, because the run worth reading is the one that
        # failed. A quiet tier is only honest if the detail it did not
        # print is still retrievable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: tmp/logs/
          if-no-files-found: warn

  # THE ONLY CHECK IN THIS REPOSITORY THAT IS NOT THIS CRATE MARKING ITS
  # OWN HOMEWORK.
  #
  # `tests/oracle_tools.rs` builds tables with this crate and requires
  # sgdisk, sfdisk, blkid and partx to report them field by field, then
  # has sgdisk and sfdisk build tables and requires this crate to read
  # the same values back. Everything else in `tests/` is the writer
  # against the reader, which cannot see the failure this crate is most
  # exposed to: agreeing with itself and disagreeing with the world. See
  # #119.
  #
  # IT IS ITS OWN JOB BECAUSE THE TARGET IS BEHIND A FEATURE. The oracle
  # refuses to skip when a tool is missing, and `test / macos-latest`
  # and `test / windows-latest` have none of these tools -- so the
  # target carries `required-features = ["oracle"]` in Cargo.toml and is
  # not in `--all-targets` anywhere else. This job is the one place the
  # feature is on, and it installs the tools first.
  oracle:
    name: oracle (external tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.3.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `util-linux` (sfdisk, blkid, partx) is already on the runner;
      # installing it anyway is what makes this step the declaration of
      # what the suite needs rather than a bet on the image's contents.
      # `gdisk` (sgdisk) is not there by default.
      - name: install the reference partitioning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdisk util-linux
          sgdisk --version
          sfdisk --version
      - name: build the oracle tests
        # Outside the budget, for the same reason as `build --release` (#155).
        run: cargo test --locked --features oracle --test oracle_tools --no-run
      - name: test the oracle
        shell: bash
        # A VERDICT, NOT A TRANSCRIPT -- this job was already the one that
        # got that right by hand, trapping a `tail -n 60` on failure only.
        # It goes through ../rust-fs-core/scripts/tier.sh now for the same reason as every
        # other tier: one implementation, a budget that is measured and
        # written down beside the task in chores.yml, and the same
        # behaviour on a laptop as in CI. The oracle makes ~780 field
        # comparisons; a line each would be exactly the failure mode the
        # budget exists for. The detail lives in the assertion message,
        # which names the image, the partition, the field, our value and
        # the tool's.
        #
        # `--quiet` drops cargo's per-test name lines and `--nocapture`
        # lets the per-test comparison counts out, so the log a green run
        # leaves is ten counts and a result line.
        #
        # TWO FLOORS, AND THIS JOB NEEDS THEM MOST OF ALL. Its whole
        # subject is a comparison that can quietly stop happening: a tool
        # whose output format moved, a target that stopped being built, a
        # feature that stopped being passed. Every one of those ends in
        # `0 passed; 0 failed`, which cargo exits 0 on.
        #
        # The first is on tests executed -- ../rust-fs-core/scripts/test-floor.sh, 9,
        # which is every test in the target rather than a percentage below
        # it: each one is a whole table format or a whole direction, and
        # losing any one is not churn.
        #
        # The second is on FIELD comparisons, summed from the counts each
        # test prints into the tier's log. Each test already asserts its
        # own floor (`Comparisons::floor`), so this total cannot silently
        # fall; it is here because it is the number that says what the job
        # did, and because it turns nine separate floors into one line a
        # reader can check. Measured 2026-09-28: 775. Floor 700, about 10%
        # below.
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (oracle)" oracle 40 3000 -- cargo test --locked --quiet --features oracle --test oracle_tools -- --nocapture
          bash ../rust-fs-core/scripts/test-floor.sh oracle 9
          f=$(awk 'match($0, /: [0-9]+ comparisons \(floor/) { hit = substr($0, RSTART, RLENGTH); split(hit, g, " "); s += g[2] } END { print s+0 }' tmp/logs/oracle.log)
          echo "oracle: $f field comparisons against sgdisk/sfdisk/blkid/partx (floor 700)"
          if [ "$f" -lt 700 ]; then
              echo "::error::only $f field comparisons ran, floor is 700 -- 775 ran on 2026-09-28, and a run that compares fewer has stopped finding fields rather than stopped disagreeing"
              exit 1
          fi
      # THE KERNEL AS THE md ORACLE. scripts/make-md-oracle.sh has mdadm
      # build arrays of every level and metadata version this crate reads
      # on loop devices, writes random data through /dev/mdX, dumps it, and
      # leaves the members as plain files. tests/oracle_md.rs assembles the
      # files with this crate and requires the kernel's bytes back, whole
      # and with each redundant member left out. It needs root and the md
      # driver, which this runner has; the test fails, never skips, when
      # the arrays are missing.
      - name: build md arrays with the kernel
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mdadm
          sudo bash scripts/make-md-oracle.sh tmp/md-oracle
      - name: build the md oracle tests
        # Outside the budget, in a step of its own, for the same reason as
        # `build the oracle tests` (#155).
        run: cargo test --locked --features oracle --test oracle_md --no-run
      - name: test the md oracle
        shell: bash
        # Two floors: both tests in the target must run, and the target
        # itself asserts every one of the 15 arrays was compared.
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (oracle md)" oracle-md 40 3000 -- cargo test --locked --quiet --features oracle --test oracle_md -- --nocapture
          bash ../rust-fs-core/scripts/test-floor.sh oracle-md 2
      - name: keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-oracle
          path: tmp/logs/
          if-no-files-found: warn
      # `--all-targets` in the `test` job does not build the oracle
      # target, because its feature is off there. This is the only job
      # that can lint it.
      - name: clippy
        run: cargo clippy --locked --features oracle --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-fs-core for `../rust-fs-core/scripts/family-check.sh` below: the family
      # scripts are core's, and core.sh finds this sibling first.
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.3.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check
      - name: the one required check stands for every job
        run: bash ../rust-fs-core/scripts/ci-gate.sh
      - name: the agent guide carries the shared block
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: bash ../rust-fs-core/scripts/agents-core-check.sh
      - name: the script tests pass
        # Every tests/scripts/*.sh, by glob, so a new guard is picked up
        # without editing this file. `nullglob` off on purpose: an empty
        # directory leaves the literal pattern, which bash cannot open, and
        # the step fails rather than passing having run nothing.
        run: |
          set -euo pipefail
          for t in tests/scripts/*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
      # The family scripts are rust-fs-core's alone: this fails if a copy of
      # one is committed here, or
      # anything here still calls a local copy.
      - name: no copy of a rust-fs-core family script
        shell: bash
        run: bash ../rust-fs-core/scripts/family-check.sh

  semver:
    # `chore check:semver`, spelled out because CI here does not install chore: this tree's public API against the newest
    # version on crates.io, refusing a break the version in Cargo.toml does
    # not declare. Why, and what it cannot see, is at the top of
    # ../rust-fs-core/scripts/semver-check.sh.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version ../rust-fs-core/scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.3.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: semver (quiet, budgeted)
        shell: bash
        run: bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- bash ../rust-fs-core/scripts/semver-check.sh

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK (#124). Branch protection used to name six
    # contexts by hand -- `fmt`, `test (release)`, the three
    # `test / <os>` matrix legs and `oracle (external tools)`. Requiring
    # this gate instead means a leg can be added to the matrix, the
    # oracle job renamed, or a job split in two, without leaving a
    # required check that never reports -- which GitHub reads as
    # permanently pending, with enforce_admins on and nothing to point
    # at. It is also the only shape in which a job-level `if:` is safe.
    if: always()
    needs: [test, test-release, oracle, fmt, semver]
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"
